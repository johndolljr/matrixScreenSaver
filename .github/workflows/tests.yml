name: Tests

permissions:
  contents: read

on:
  push:
    branches:
      - development
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - development
      - main

jobs:
  test:
    name: Run tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: ./tests.sh

      - name: Build screen saver
        run: ./build.sh

      - name: Build wallpaper app
        run: ./build-wallpaper.sh

      - name: Run wallpaper AppKit checks
        run: ./wallpaper-tests.sh
